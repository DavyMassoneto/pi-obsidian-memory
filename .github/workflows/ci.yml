name: ci

# Publishing to npm lives in release.yml (triggered by a tag).
on:
  push:
    branches: [dev, "feature/**", "chore/**", "bugfix/**", "release/**", "hotfix/**"]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    env:
      OPENSPEC_TELEMETRY: "0"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Dependencies
        run: npm ci

      - name: Lint, formatting and imports (Biome)
        run: npx biome ci --reporter=github .

      - name: Types
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: OpenSpec specs
        run: npx --yes @fission-ai/openspec@1.13.1 validate --all --strict --no-interactive
