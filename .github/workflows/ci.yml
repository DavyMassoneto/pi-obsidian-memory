name: ci

# Integração contínua: roda a cada push nas branches do Git Flow e em cada PR.
# A publicação no npm fica no release.yml (disparado por tag).
on:
  push:
    branches: [dev, "feature/**", "bugfix/**", "release/**", "hotfix/**"]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    env:
      OPENSPEC_TELEMETRY: "0"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Dependências
        if: hashFiles('package-lock.json') != ''
        run: npm ci

      - name: Script de release (sintaxe)
        run: node --check scripts/release.mjs

      - name: Specs do OpenSpec
        run: npx --yes @fission-ai/openspec@1.13.1 validate --all --strict --no-interactive

      - name: Testes
        run: npm test --if-present
