name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install --global npm@11
      - run: npm ci
      - id: next
        run: |
          bumped="$(npx git-cliff --bumped-version)"
          if [ "$bumped" = "v$(node -p "require('./package.json').version")" ]; then
            echo "Nothing to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "tag=$bumped" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.next.outputs.release == 'true'
        run: |
          npm version "${{ steps.next.outputs.tag }}" --no-git-tag-version
          npx git-cliff --tag "${{ steps.next.outputs.tag }}" --output CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "chore(release): ${{ steps.next.outputs.tag }} [skip ci]"
          git tag "${{ steps.next.outputs.tag }}"
      - if: steps.next.outputs.release == 'true'
        run: |
          token="$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=claims-check" | node -p 'JSON.parse(require("fs").readFileSync(0)).value')"
          node -e 'const c = JSON.parse(Buffer.from(process.argv[1].split(".")[1], "base64url").toString()); console.log(JSON.stringify({ repository: c.repository, repository_owner: c.repository_owner, repository_id: c.repository_id, workflow_ref: c.workflow_ref, job_workflow_ref: c.job_workflow_ref, environment: c.environment, ref: c.ref, event_name: c.event_name, runner_environment: c.runner_environment }))' "$token"
          npm --version
          npm publish --access public --loglevel verbose
      - if: steps.next.outputs.release == 'true'
        run: git push origin HEAD:main "${{ steps.next.outputs.tag }}"
      - if: steps.next.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npx git-cliff --latest --strip header --output notes.md
          gh release create "${{ steps.next.outputs.tag }}" --title "${{ steps.next.outputs.tag }}" \
            --notes-file notes.md --latest --verify-tag
