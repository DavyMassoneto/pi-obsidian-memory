schema: spec-driven

context: |
  Language: English
  All artifacts must be written in English. Talk to the user in Brazilian Portuguese.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Project: a pi extension (TypeScript/ESM, Node >= 24) that stores the agent's long-term memory
  in Obsidian vaults in any folder. OneDrive is OPTIONAL (Windows 11 first, portable core).
  One dedicated GLOBAL vault (learnings about the user) and one vault per PROJECT (created by /memory-init).
  Reused base: modules from pi-hermes-memory (MIT). Git Flow with git-flow-next (main, dev, feature/*, chore/*).

  Do not confuse: the SPEC system (this repository's docs: docs/ and openspec/) is NOT the MEMORY system
  (the product, whose data lives in the vaults).

  Sources of truth: AGENTS.md (rules) · docs/STATE.md (where we are) · docs/OPEN-QUESTIONS.md (decisions and doubts)
  · docs/research/ (research) · docs/decisions/ (ADRs).

rules:
  proposal:
    - "Before proposing, read docs/STATE.md and docs/OPEN-QUESTIONS.md. If there is an open 🔴 question tied to this change, STOP and ask (one at a time, with options and a recommendation)."
    - "Include an 'Open questions' section. A doubt that affects scope, on-disk format or user data becomes a question, never an assumption."
    - "Declare the new or changed configuration keys (name, default, validation) and the affected onboarding step (/memory-setup or /memory-init)."
    - "Cite the decisions from docs/OPEN-QUESTIONS.md (Q-xx IDs) and the ADRs that support the proposal."
  specs:
    - "Every requirement uses SHALL/MUST and has at least one WHEN/THEN scenario."
    - "Cite the matching REQ-xx from docs/01-requirements.md when it exists."
  design:
    - "Writing to a vault: full read + hash before writing, a guard against drastic shrinking, a .tmp file + rename with retry (EPERM/EBUSY)."
    - "Never SQLite, locks, recovery temp files or .git inside the vaults: index, locks and config live in ~/.pi/agent/<package>/."
    - "OneDrive is optional: the core works with any folder; the OneDrive protections (pinning, cloud-only files, conflict copies) only run with sync.provider = onedrive, detected and confirmed during onboarding."
    - "The agent only reads and writes in the memory vaults; nothing is deleted: it goes to archive/."
    - "A decision that is hard to reverse (on-disk format, tool API, data location) requires an ADR in docs/decisions/ (MADR)."
  tasks:
    - "Each task fits in one session and states its verification command (e.g. npx vitest run <file>)."
    - "Separate automatic verification from manual verification (e.g. checking the note in Obsidian)."
    - "All the work happens on a Git Flow feature branch (git flow feature start <name>); never commit directly to main or dev."

operations:
  apply:
    guidance:
      - "Read docs/STATE.md before starting and do one task at a time."
      - "If reality diverges from the spec, STOP and report: expected / found / impact / how to proceed. The spec is fixed before the code."
      - "Only mark a task as done after running its verification and showing the output."
      - "When the session ends, update docs/STATE.md (done, next action, blockers)."
  archive:
    guidance:
      - "Before archiving, check that the code still matches the specs (drift) and that docs/OPEN-QUESTIONS.md and the ADRs are up to date."
      - "After archiving, update docs/STATE.md."
      - "With the user's agreement, finish the feature (git flow feature finish <name>) and run git push origin dev."
