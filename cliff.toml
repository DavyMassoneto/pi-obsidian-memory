# git-cliff: next version and CHANGELOG from the Conventional Commits.
# Reference: https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

Notable changes in each version. The format follows [Keep a Changelog](https://keepachangelog.com/en/1.1.0/) \
and versions follow [SemVer](https://semver.org/). Generated by `npm run release` with [git-cliff](https://git-cliff.org).
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.breaking %}⚠️ **breaking:** {% endif %}\
{% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{{ commit.message | upper_first }} ({{ commit.id | truncate(length=7, end="") }})\
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
protect_breaking_commits = true
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "newest"
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^(refactor|build|ci|docs|test|style|chore)", group = "<!-- 3 -->Maintenance" },
]

[bump]
# feat bumps the minor; in 0.x a breaking change also bumps only the minor (from 1.0 on it bumps the major).
features_always_bump_minor = true
breaking_always_bump_major = false
# Types that do not justify a new version on their own.
no_increment_regex = "^(build|chore|ci|docs|refactor|style|test)$"
# Version used while there is no tag yet: 0.0.0 was the placeholder published by hand, without a tag.
initial_tag = "v0.0.1"
