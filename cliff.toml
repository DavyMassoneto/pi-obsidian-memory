# git-cliff: next version and CHANGELOG from the Conventional Commits.
# Reference: https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

Notable changes in each version. The format follows [Keep a Changelog](https://keepachangelog.com/en/1.1.0/) \
and versions follow [SemVer](https://semver.org/). Generated by the release workflow with \
[git-cliff](https://git-cliff.org).

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.breaking %}⚠️ **breaking:** {% endif %}\
{% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{{ commit.message | upper_first }} ({{ commit.id | truncate(length=7, end="") }})\
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
# A squash commit has the PR title as header and the PR's commit messages in the body: each line counts as a commit.
split_commits = true
# GitHub lists the PR's commits in the squash body as "* <message>" bullets.
commit_preprocessors = [
  { pattern = "(?m)^\\* ", replace = "" },
]
processing_order = ["commit_preprocessors", "split_commits", "conventional_commits", "commit_parsers", "link_parsers"]
protect_breaking_commits = true
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "newest"
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^(refactor|build|ci|docs|test|style|chore)", group = "<!-- 3 -->Maintenance" },
  { message = ".*", skip = true },
]

[bump]
# feat bumps the minor; in 0.x a breaking change also bumps only the minor.
features_always_bump_minor = true
breaking_always_bump_major = false
# Types that do not justify a new version on their own.
no_increment_regex = "^(build|chore|ci|docs|refactor|style|test)$"
# Version used while no tag is reachable: npm already has 0.0.1, published by hand.
initial_tag = "v0.0.1"
